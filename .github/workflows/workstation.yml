name: Git workstation
on:
  push:
    branches: [main, 'iteration/**']
    paths-ignore: ['reports/**']
  pull_request:
    paths-ignore: ['reports/**']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: workstation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workstation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/bdd-workstation-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Package exact source revision
        run: |
          mkdir -p verification
          git archive --format=tar.gz --output=verification/workstation-source.tar.gz HEAD
          git rev-parse HEAD > verification/source-commit.txt
          node --version > verification/runtime.txt
          git --version >> verification/runtime.txt
      - name: Check source ownership and maintained documentation
        run: npm run check:repository 2>&1 | tee verification/repository.log
      - name: Check workstation syntax
        run: node scripts/check-workstation.mjs 2>&1 | tee verification/syntax.log
      - name: Install and build locked workstation and PTY dependencies
        run: |
          npm ci 2>&1 | tee verification/install.log
          npm run build 2>&1 | tee verification/build.log
      - name: Install browser used by test-plan lifecycle checks
        run: node_modules/.bin/playwright install --with-deps chromium 2>&1 | tee verification/browser-install.log
      - name: Test actual Git, processes, CLI and HTTP
        run: node --test tests/workstation/*.test.mjs 2>&1 | tee verification/tests.log
      - name: Preserve exact source and verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workstation-${{ github.sha }}
          path: verification/
          retention-days: 3
          if-no-files-found: error

  browser-acceptance:
    needs: workstation
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install application and PTY runtime
        run: npm ci && npm run build
      - name: Real browser and repository management acceptance
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
          WB_E2E_ARTIFACTS: ${{ runner.temp }}/workstation-e2e
        run: |
          mkdir -p "$WB_E2E_ARTIFACTS"
          node_modules/.bin/playwright install --with-deps chromium 2>&1 | tee "$WB_E2E_ARTIFACTS/browser-install.log"
          npm run test:workstation:e2e 2>&1 | tee "$WB_E2E_ARTIFACTS/browser-tests.log"
      - name: Preserve browser evidence and dependency receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workstation-browser-${{ github.sha }}
          path: ${{ runner.temp }}/workstation-e2e/
          retention-days: 3
          if-no-files-found: error

  application-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/bdd-application-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked application dependencies
        run: |
          mkdir -p verification
          npm ci 2>&1 | tee verification/application-install.log
      - name: Discover maintained workstation browser tests
        run: npm run spec:list 2>&1 | tee verification/browser-discovery.log
      - name: Reject unused production declarations
        run: npm run check:unused 2>&1 | tee verification/application-unused.log
      - name: Type check application
        run: npm run check 2>&1 | tee verification/application-check.log
      - name: Build application
        run: |
          mkdir -p dist/src dist/tests
          printf 'throw new Error("stale compiled module")\n' > dist/src/retired-cleanup-probe.js
          printf 'throw new Error("stale compiled test")\n' > dist/tests/retired-cleanup-probe.test.js
          npm run build 2>&1 | tee verification/application-build.log
          test ! -e dist/src/retired-cleanup-probe.js
          test ! -e dist/tests/retired-cleanup-probe.test.js
      - name: Install browser required by existing application UI tests
        run: node_modules/.bin/playwright install --with-deps chromium 2>&1 | tee verification/application-browser-install.log
      - name: Run application unit and integration checks
        run: npm run test:app 2>&1 | tee verification/application-tests.log
      - name: Verify build and deployment regeneration did not modify tracked sources
        run: git diff --exit-code && npm run check:repository
      - name: Preserve application validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workstation-application-${{ github.sha }}
          path: |
            verification/application-*.log
            verification/browser-discovery.log
          retention-days: 3
          if-no-files-found: error
