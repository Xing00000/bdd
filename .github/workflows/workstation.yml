name: Git workstation
on:
  push:
    branches: [main, 'iteration/**']
    paths-ignore: ['reports/**']
  pull_request:
    paths-ignore: ['reports/**']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: workstation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workstation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Package exact source revision
        run: |
          mkdir -p verification
          git archive --format=tar.gz --output=verification/workstation-source.tar.gz HEAD
          git rev-parse HEAD > verification/source-commit.txt
          node --version > verification/runtime.txt
          git --version >> verification/runtime.txt
      - name: Check workstation syntax
        run: node scripts/check-workstation.mjs 2>&1 | tee verification/syntax.log
      - name: Test actual Git, processes, CLI and HTTP
        run: node --test tests/workstation/*.test.mjs 2>&1 | tee verification/tests.log
      - name: Preserve exact source and verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workstation-${{ github.sha }}
          path: verification/
          retention-days: 3
          if-no-files-found: error

  browser-acceptance:
    needs: workstation
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Real browser and repository management acceptance
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
          WB_E2E_ARTIFACTS: ${{ runner.temp }}/workstation-e2e
        run: |
          mkdir -p "$WB_E2E_ARTIFACTS"
          node --test tests/workstation-e2e/*.test.mjs 2>&1 | tee "$WB_E2E_ARTIFACTS/browser-tests.log"
      - name: Preserve browser evidence and dependency receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workstation-browser-${{ github.sha }}
          path: ${{ runner.temp }}/workstation-e2e/
          retention-days: 3
          if-no-files-found: error

  application-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked application dependencies
        run: |
          mkdir -p verification
          npm ci 2>&1 | tee verification/application-install.log
      - name: Type check application
        run: npm run check 2>&1 | tee verification/application-check.log
      - name: Build application
        run: npm run build 2>&1 | tee verification/application-build.log
      - name: Run application unit and integration checks
        run: npm run test:app 2>&1 | tee verification/application-tests.log
      - name: Preserve application validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workstation-application-${{ github.sha }}
          path: verification/application-*.log
          retention-days: 3
          if-no-files-found: error
